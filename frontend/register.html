<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Lost &amp; Found Portal</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body style="background:linear-gradient(135deg,#f8f7f4 0%,#e2e8f0 100%)">

  <div id="nav-placeholder"></div>

  <div class="auth-page">
    <div class="auth-card card" style="max-width:480px">
      <div class="auth-header">
        <div class="auth-icon">✨</div>
        <h2>Create Account</h2>
        <p style="margin-top:6px;font-size:.9rem">Join the community and help reunite people with their belongings</p>
      </div>
      <div class="auth-body">
        <form id="registerForm">
          <div class="form-group">
            <label class="form-label">Full Name *</label>
            <div class="input-icon-wrap">
              <span class="icon">👤</span>
              <input type="text" class="form-control" name="name" id="name" placeholder="Ravi Patil" required />
            </div>
            <span class="form-error">Please enter your full name.</span>
          </div>

          <div class="form-group">
            <label class="form-label">Email Address *</label>
            <div class="input-icon-wrap">
              <span class="icon">✉️</span>
              <input type="email" class="form-control" name="email" id="reg_email" placeholder="you@example.com" required />
            </div>
            <span class="form-error">Enter a valid email address.</span>
          </div>

          <div class="form-group">
            <label class="form-label">Phone Number</label>
            <div class="input-icon-wrap">
              <span class="icon">📞</span>
              <input type="tel" class="form-control" name="phone" placeholder="9876543210" />
            </div>
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label class="form-label">Password *</label>
              <div class="input-icon-wrap" style="position:relative">
                <span class="icon">🔒</span>
                <input type="password" class="form-control" name="password" id="password" placeholder="Min. 8 chars" required style="padding-right:40px" />
                <button type="button" class="password-toggle">👁</button>
              </div>
              <span class="form-error">Password is required.</span>
            </div>
            <div class="form-group">
              <label class="form-label">Confirm Password *</label>
              <div class="input-icon-wrap" style="position:relative">
                <span class="icon">🔒</span>
                <input type="password" class="form-control" name="confirm_password" id="confirm_password" placeholder="Repeat password" required style="padding-right:40px" />
                <button type="button" class="password-toggle">👁</button>
              </div>
              <span class="form-error">Passwords do not match.</span>
            </div>
          </div>

          <div style="margin-bottom:20px">
            <label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:.85rem;color:var(--text-muted)">
              <input type="checkbox" required style="margin-top:3px;accent-color:var(--amber)" />
              I agree to the <a href="#" style="color:var(--amber-dark);font-weight:600">Terms of Service</a> and <a href="#" style="color:var(--amber-dark);font-weight:600">Privacy Policy</a>
            </label>
          </div>

          <button type="submit" class="btn btn-amber btn-lg" style="width:100%;justify-content:center">
            Create Account →
          </button>
        </form>

        <div class="auth-footer-link">
          Already have an account? <a href="login.html">Sign in →</a>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/partials.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('nav-placeholder').innerHTML = NAV_HTML;
  </script>
</body>
</html>
