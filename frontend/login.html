<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Lost &amp; Found Portal</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body style="background:linear-gradient(135deg,#f8f7f4 0%,#e2e8f0 100%)">

  <div id="nav-placeholder"></div>

  <div class="auth-page">
    <div class="auth-card card">
      <div class="auth-header">
        <div class="auth-icon">🔍</div>
        <h2>Welcome Back</h2>
        <p style="margin-top:6px;font-size:.9rem">Sign in to manage your posts and matches</p>
      </div>
      <div class="auth-body">
        <form id="loginForm">
          <div class="form-group">
            <label class="form-label">Email Address *</label>
            <div class="input-icon-wrap">
              <span class="icon">✉️</span>
              <input type="email" class="form-control" name="email" id="email" placeholder="you@example.com" required />
            </div>
            <span class="form-error">Enter a valid email address.</span>
          </div>

          <div class="form-group">
            <label class="form-label">Password *</label>
            <div class="input-icon-wrap" style="position:relative">
              <span class="icon">🔒</span>
              <input type="password" class="form-control" name="password" id="password" placeholder="Enter your password" required style="padding-right:44px" />
              <button type="button" class="password-toggle" style="right:14px">👁</button>
            </div>
            <span class="form-error">Password is required.</span>
          </div>

          <div style="display:flex;justify-content:flex-end;margin-top:-8px;margin-bottom:20px">
            <a href="#" style="font-size:.82rem;color:var(--amber-dark);font-weight:600">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center">
            Sign In →
          </button>
        </form>

        <div class="auth-divider"><span>or continue with</span></div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <button class="btn btn-outline" style="justify-content:center;gap:8px" onclick="demoLogin()">
            🎭 Demo Login
          </button>
          <button class="btn btn-outline" style="justify-content:center;gap:8px" onclick="adminLogin()">
            🔑 Admin Login
          </button>
        </div>

        <div class="auth-footer-link">
          Don't have an account? <a href="register.html">Create one free →</a>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/partials.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('nav-placeholder').innerHTML = NAV_HTML;
    function demoLogin() {
      document.getElementById('email').value = 'demo@example.com';
      document.getElementById('password').value = 'demo1234';
    }
    function adminLogin() {
      document.getElementById('email').value = 'admin@gmail.com';
      document.getElementById('password').value = 'Admin@123';
    }
  </script>
</body>
</html>
